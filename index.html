<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Controlo Automático Shelly</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 100px; background: #fafafa; color: #333; }
    .status { font-size: 20px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h1>Painel Shelly Cloud</h1>
  <p id="status-texto" class="status">A ligar à Shelly Cloud...</p>

  <script>
    // Substituição oficial do $w.onReady do Wix para o GitHub/Canvas
    window.addEventListener("DOMContentLoaded", function () {
        const status = document.getElementById("status-texto");

        // Técnica de URL Direta (GET) para contornar o desaparecimento de dados causado pelo CORS
        const urlBase = "https://shelly.cloud";
        const parametros = "?channel=0&turn=on&timer=1&id=441793a5621c&auth_key=ZjJmMGF1aWQE3BBDBB3C3994FEF570BD05536F0B61870FB50B101EC413C1AD36FD450AB5E5381162F50DF2E1458";

        fetch(urlBase + parametros, {
            method: "GET",
            mode: "no-cors" // Remove o bloqueio do navegador
        })
        .then(function() {
            status.textContent = "🟢 Comando enviado com sucesso!";
            status.style.color = "#28a745";
            console.log("Pedido processado.");
        })
        .catch(function(err) {
            status.textContent = "🔴 Falha crítica na rede.";
            status.style.color = "#dc3545";
            console.error(err);
        });
    });
  </script>

</body>
</html>
