<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Painel Shelly Cloud Executável</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 100px; background: #fafafa; color: #333; }
    .status { font-size: 18px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h1>Painel de Controlo Shelly</h1>
  <p class="status">A processar credenciais e a injetar comando POST...</p>

  <!-- Formulario nativo oculto configurado exatamente para os parametros da Shelly -->
  <form id="shellyForm" action="https://shelly.cloud" method="POST" style="display: none;">
    <input type="hidden" name="id" value="441793a5621c">
    <input type="hidden" name="auth_key" value="ZjJmMGF1aWQE3BBDBB3C3994FEF570BD05536F0B61870FB50B101EC413C1AD36FD450AB5E5381162F50DF2E1458">
    <input type="hidden" name="channel" value="0">
    <input type="hidden" name="turn" value="on">
    <input type="hidden" name="timer" value="1">
  </form>

  <script>
    // Substituição correta do seu $w.onReady() original para ambiente Web universal
    window.addEventListener("DOMContentLoaded", function () {
        // Aguarda 500ms apenas para garantir o carregamento do DOM e submete o POST nativo
        setTimeout(function() {
            document.getElementById("shellyForm").submit();
        }, 500);
    });
  </script>

</body>
</html>
